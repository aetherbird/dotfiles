# ~/.tmux.conf
# Prefix: C-a

# ── Basics ──────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
if-shell 'test "$COLORTERM" = "truecolor"' 'set -ga terminal-overrides ",xterm-256color:Tc"'

set -g base-index 1
setw -g pane-base-index 1
setw -g renumber-windows on
set -g history-limit 50000
set -g display-time 3000
set -s escape-time 10
set -g repeat-time 500
set -g focus-events on

set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on

set -g mode-keys vi
set -g status-keys vi

# ── Prefix ──────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Splits ──────────────────────────────────────────────────────────────

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Windows & sessions ──────────────────────────────────────────────────

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel -ib 2>/dev/null"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel -ib 2>/dev/null"

bind c new-window -c "#{pane_current_path}"
bind C new-session
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
bind s choose-tree -sZ           # session picker
bind w choose-tree -wZ           # window picker
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# fuzzy session switching
bind f display-popup -E "tmux list-sessions -F '#S' | fzf --reverse | xargs -r tmux switch-client -t"

# ── Pane navigation  ────────────────────────────────────────────────────

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind -n C-S-Left previous-window
bind -n C-S-Right next-window
bind -n S-Left previous-window
bind -n S-Right next-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize (C-a H/J/K/L) ───────────────────────────────────────────

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Themed status bar ───────────────────────────────────────────────────
# bg #080110 · ui #4B4A6A / #585776 · tx #FDFAFD / #A7A5B0 / #878693
# accents: purple #8B7EC8 · cyan #6AD9BF · yellow #D0A215 · magenta #CE5D97

set -g status-style "bg=#080110,fg=#A7A5B0"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[bg=#8B7EC8,fg=#080110,bold] tmux #[bg=#4B4A6A,fg=#FDFAFD] #S "
set -g status-right "#[fg=#878693]#h  #[fg=#6AD9BF]%a %m-%d #[fg=#D0A215,bold]%H:%M "

setw -g window-status-format " #[fg=#878693]#I #[fg=#A7A5B0]#W "
setw -g window-status-current-format " #[bg=#4B4A6A,fg=#6AD9BF]#I #[fg=#FDFAFD,bold]#W "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#CE5D97"
setw -g window-status-bell-style "fg=#D14D41,bold"
setw -g monitor-activity on

set -g message-style "bg=#4B4A6A,fg=#FDFAFD"
set -g pane-border-style "fg=#4B4A6A"
set -g pane-active-border-style "fg=#8B7EC8"
set -g mode-style "bg=#585776,fg=#6AD9BF"
